---
layout: default
---
<article class="case-study">
  <p class="eyebrow">Case Study</p>
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.company }} · {{ page.role }} · {{ page.timeframe }}</p>

  {% if page.impact %}
  <div class="impact-row">
    {% for stat in page.impact %}
      <div class="impact-stat">
        <div class="impact-number">{{ stat.number }}</div>
        <div class="impact-label">{{ stat.label }}</div>
      </div>
    {% endfor %}
  </div>
  {% endif %}

  {{ content }}

  <p><a href="{{ '/case-studies/' | relative_url }}">&larr; Back to all case studies</a></p>
</article>
